name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            payroll-backend/package-lock.json
            payroll-react/package-lock.json
      - name: Backend install and test
        working-directory: payroll-backend
        run: npm ci && npm test
      - name: Frontend install and build
        working-directory: payroll-react
        run: npm ci && npm run build
      - name: Benchmark structural validation
        working-directory: benchmark-data
        run: python3 validate_benchmark.py benchmark-dataset.json /tmp/validation-report.md

